name: CI Backend

on:
  pull_request:
  push:
    branches:
      - main
      - new

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MeuProjetoFinanceiro.API/MeuProjetoFinanceiro.API.csproj

      - name: Build
        run: dotnet build MeuProjetoFinanceiro.API/MeuProjetoFinanceiro.API.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test MeuProjetoFinanceiro.Tests/MeuProjetoFinanceiro.Tests.csproj --configuration Release
