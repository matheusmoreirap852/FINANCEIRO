name: Deploy EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - new

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/meu-financeiro-api
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/meu-financeiro-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: matheusmoreirap852/front-endProjetoFinanceiro
          path: MeuProjetoFinanceiro.Frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        run: |
          echo "API_IMAGE=${REGISTRY}/${API_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "API_IMAGE_LATEST=${REGISTRY}/${API_IMAGE_NAME}:latest" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_LATEST=${REGISTRY}/${FRONTEND_IMAGE_NAME}:latest" >> "$GITHUB_ENV"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MeuProjetoFinanceiro.API/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}
            ${{ env.API_IMAGE_LATEST }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: MeuProjetoFinanceiro.Frontend
          file: MeuProjetoFinanceiro.Frontend/Dockerfile
          push: true
          build-args: |
            EXPO_PUBLIC_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE_LATEST }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          EC2_USER="${EC2_USER:-ubuntu}"
          EC2_APP_DIR="${EC2_APP_DIR:-/home/ubuntu/apps}"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$EC2_APP_DIR/MeuProjetoFinanceiro'"
          scp -i ~/.ssh/ec2_key docker-compose.ec2.images.yml "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/MeuProjetoFinanceiro/docker-compose.ec2.images.yml"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          API_IMAGE: ${{ env.API_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          EC2_USER="${EC2_USER:-ubuntu}"
          EC2_APP_DIR="${EC2_APP_DIR:-/home/ubuntu/apps}"
          GHCR_USERNAME="${GHCR_USERNAME:-${{ github.actor }}}"
          GHCR_READ_TOKEN_B64="$(printf '%s' "$GHCR_READ_TOKEN" | base64 | tr -d '\n')"

          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" \
            "EC2_APP_DIR='$EC2_APP_DIR' GHCR_USERNAME='$GHCR_USERNAME' GHCR_READ_TOKEN_B64='$GHCR_READ_TOKEN_B64' API_IMAGE='$API_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" << 'EOF'
            set -e

            if [ -n "$GHCR_READ_TOKEN_B64" ]; then
              GHCR_READ_TOKEN="$(printf '%s' "$GHCR_READ_TOKEN_B64" | base64 -d)"
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            cd "$EC2_APP_DIR/MeuProjetoFinanceiro"
            API_IMAGE="$API_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose --env-file .env -f docker-compose.ec2.images.yml pull
            docker ps -aq --filter "name=meuprojetofinanceiro" | xargs -r docker rm -f
            API_IMAGE="$API_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" docker compose --env-file .env -f docker-compose.ec2.images.yml up -d
            docker image prune -f
          EOF
