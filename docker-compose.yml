services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app
    volumes:
      - .:/app
    command: dotnet run --project MeuProjetoFinanceiro.Web --urls http://0.0.0.0:8080
    ports:
      - "8080:8080"

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /app
    volumes:
      - .:/app
    command: dotnet run --project MeuProjetoFinanceiro.API --urls http://0.0.0.0:8081
    ports:
      - "8081:8081"
